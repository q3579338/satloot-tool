# tool.satloot.com —— satloot 工具站落地页（纯静态单文件）
# 装法：放进 /etc/nginx/sites-available/tool.satloot.com，软链到 sites-enabled/，
#       nginx -t 通过后 systemctl reload nginx。
# 证书沿用本机自签（Cloudflare 回源 Full 模式），和 bnbbang.com / earn.satloot.com 一致。
# 纯静态站，不反代、不开放任何写接口，和机上其它站点互不干扰。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tool.satloot.com;

    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;

    root /var/www/satloot-tool;
    index index.html;

    # 单文件页面，内联 SVG 很占体积，压完能小一大截
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html 默认就压，再列一次 nginx 会 warn
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 页面每次发布都会变，别让 Cloudflare 和浏览器缓存住旧的
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
